<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
  body { font-family: system-ui; background: #0b1220; color: #e2e8f0; padding: 20px; max-width: 800px; margin: auto; }
  .card { background: #111a2e; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
  input { width: 100%; padding: 10px; margin: 8px 0; background: #1e293b; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box;}
  button { width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;}
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 12px; border-bottom: 1px solid #1e293b; }
  .flash { animation: flash 2s ease-out; }
  @keyframes flash { 0% { background: rgba(34,197,94,.4); } 100% { background: transparent; } }
  .status-dot { display: inline-block; width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
</style>
</head>
<body>

  <h2><span class="status-dot"></span> Live Workspace Collections</h2>

  <!-- 1. CREATION FORM -->
  <div class="card">
    <h3>New Payment Request</h3>
    <input id="phone" type="number" placeholder="WhatsApp Number (e.g., 919876543210)">
    <input id="amount" type="number" placeholder="Amount (₹)">
    <input id="desk" type="text" placeholder="Desk / Room Number">
    <button onclick="sendRequest()">Generate & Open WhatsApp</button>
  </div>

  <!-- 2. LIVE FEED -->
  <div class="card">
    <h3>Live Bank Settlements</h3>
    <table>
      <thead><tr><th>Desk/Room</th><th>Amount</th><th>UTR Number</th><th>Time</th></tr></thead>
      <tbody id="feed"></tbody>
    </table>
  </div>

<script>
  // Step 1: Create link and open WhatsApp
  async function sendRequest() {
    const phone = document.getElementById('phone').value;
    const amount = document.getElementById('amount').value;
    const desk = document.getElementById('desk').value;

    if(!phone || !amount) return alert("Phone and Amount are required.");

    // Call our server to create the invoice
    const res = await fetch('/api/create-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, amount, desk })
    });
    const data = await res.json();

    // Create the free wa.me link with pre-filled text
    const message = `Hi, your workspace rent for ${desk} is due. Amount: ₹${amount}. Pay securely via UPI here: ${data.paymentLink}`;
    const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    
    // Open WhatsApp instantly
    window.open(waUrl, '_blank');
  }

  // Step 2: Listen for Live Bank confirmations (SSE)
  const es = new EventSource('/api/dashboard-stream');
  es.addEventListener('payment_received', (e) => {
    const txn = JSON.parse(e.data);
    const tr = document.createElement('tr');
    tr.className = 'flash';
    tr.innerHTML = `
      <td><b>${txn.desk || 'N/A'}</b></td>
      <td style="color:#4ade80; font-weight:bold;">₹${(txn.amount/100).toFixed(2)}</td>
      <td>${txn.utr}</td>
      <td>${new Date(txn.time).toLocaleTimeString()}</td>
    `;
    document.getElementById('feed').prepend(tr);
  });
</script>
</body>
</html>
